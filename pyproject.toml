[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "convrag"
version = "0.1.0"
description = "Conversational RAG service over support documentation, measured on MultiDoc2Dial"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Adwitiya Shukla" }]
dependencies = [
  "numpy>=2.0",
  "fastembed>=0.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
convrag = "convrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
convrag = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]
